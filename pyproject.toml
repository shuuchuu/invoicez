[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "gitpython >= 3, < 4",
  "google-api-python-client >= 2, < 3",
  "google-auth-oauthlib >= 1, < 3",
  "jinja2 >= 3, < 4",
  "pandas >= 2, < 3",
  "pydantic >= 2, < 3",
  "pyyaml >= 6, < 7",
  "rich >= 13, < 14",
  "typer >= 0.15, < 0.16",
]
description = "Tool to handle invoices."
homepage = "https://github.com/m09/invoicez"
name = "invoicez"
readme = "README.md"
requires-python = ">= 3.12"
version = "4.0.0"

[dependency-groups]
dev = [
  "mypy >= 1",
  "pdfminer-six >= 20240706",
  "pytest >= 8",
  "pytest-cov >= 6",
  "ruff >= 0.11",
  "types-pyyaml >=6",
]

[project.scripts]
invoicez = "invoicez.cli:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["D1", "D203", "D213"]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "N", "PIE", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
