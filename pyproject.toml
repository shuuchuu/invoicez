[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
  {name = "NyxAether", email = "contact.nyxhemera@gmail.com"},
]
dependencies = [
  "cyclopts >= 4",
  "deepmerge>=3.0.1",
  "factur-x >= 6.8",
  "gitpython >= 3",
  "jinja2 >= 3",
  "niquests >= 3",
  "platformdirs >= 4",
  "pydantic >= 2.13",
  "pyyaml >= 6",
]
description = "Tool to handle invoices."
homepage = "https://codeberg.org/shuuchuu/invoicez"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "invoicez"
readme = "README.md"
requires-python = ">= 3.12"
version = "4.1.1"

[dependency-groups]
dev = [
  "bumpver >= 2025.1131",
  "doit >= 0.37",
  "google-api-python-client >= 2",
  "google-auth-oauthlib >= 1",
  "pdfminer-six >= 20260107",
  "pytest >= 8",
  "ruff >= 0.11",
  "ty >= 0.0.33",
  "types-pyyaml >= 6",
]

[project.scripts]
invoicez = "invoicez.cli:main"

[project.optional-dependencies]
gcal = [
  "google-api-python-client >= 2",
  "google-auth-oauthlib >= 1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "D1",
  "incorrect-blank-line-before-class", # D203
  "multi-line-summary-second-line", # D213
  "non-empty-init-module", # RUF067
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[bumpver]
commit = true
commit_message = "Bump version to {new_version}"
current_version = "4.1.1"
push = true
tag = true
tag_message = "{new_version}"
version_pattern = "MAJOR.MINOR.PATCH"

[bumpver.file_patterns]
"pyproject.toml" = [
  '^version = "{version}"$',
  '^current_version = "{version}"$',
]
"src/invoicez/__init__.py" = [
  '^__version__ = "{version}"$',
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11,<0.12.0"]
