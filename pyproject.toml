[project]
authors = [
  {name = "mog", email = "mog@noreply.git.ogion.eu"},
  {name = "NyxAether", email = "contact.nyxhemera@gmail.com"},
]
classifiers = ["Topic :: Software Development :: Build Tools"]
dependencies = [
  "click>=8.3.2",
  "coloredlogs>=15.0.1",
  "gitpython>=3.1.46",
  "jinja2>=3.1.6",
  "pyyaml>=6.0.3",
]
description = "Tool to handle invoices."
homepage = "https://git.ogion.eu/mog/invoicez"
license = "Apache-2.0"
name = "invoicez"
readme = "README.md"
requires-python = ">=3.12"
version = "3.1.1"

[dependency-groups]
dev = [
  "appdirs >= 1",
  "bumpver>=2025.1131",
  "mypy >= 1",
  "pdfminer-six >= 20260107",
  "pytest >= 9",
  "ruff >= 0.15",
  "types-pyyaml >= 6",
]

[project.scripts]
invoicez = "invoicez.cli:cli"

[tool.ruff.lint]
ignore = ["D1", "D203", "D213", "RUF067"]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true

[bumpver]
commit = true
commit_message = "Bump version to {new_version}"
current_version = "3.1.1"
push = true
tag = true
version_pattern = "MAJOR.MINOR.PATCH"

[bumpver.file_patterns]
"pyproject.toml" = [
  '^version = "{version}"$',
  '^current_version = "{version}"$',
]
"src/invoicez/__init__.py" = [
  '^__version__ = "{version}"$',
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.3,<0.12.0"]
