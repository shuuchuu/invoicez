[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
  {name = "NyxAether", email = "contact.nyxhemera@gmail.com"},
]
dependencies = [
  "click>=8.4.2",
  "coloredlogs>=15.0.1",
  "gitpython>=3.1.60",
  "jinja2>=3.1.6",
  "pyyaml>=6.0.3",
]
description = "Tool to handle invoices."
homepage = "https://codeberg.org/shuuchuu/invoicez"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "invoicez"
readme = "README.md"
requires-python = ">= 3.12"
version = "3.3.0"

[dependency-groups]
dev = [
  "appdirs>=1.4.4",
  "bumpver >= 2025.1131",
  "doit >= 0.37",
  "pdfminer-six>=20260107",
  "pytest >= 8",
  "ruff >= 0.11",
  "ty >= 0.0.33",
  "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["D1", "D203", "D213", "RUF067"]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[bumpver]
commit = true
commit_message = "Bump version to {new_version}"
current_version = "3.3.0"
push = true
tag = true
tag_message = "{new_version}"
version_pattern = "MAJOR.MINOR.PATCH"

[bumpver.file_patterns]
"pyproject.toml" = [
  '^version = "{version}"$',
  '^current_version = "{version}"$',
]
"src/invoicez/__init__.py" = [
  '^__version__ = "{version}"$',
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11,<0.12.0"]
